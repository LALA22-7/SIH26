[project]
name = "cyclonewatch-backend"
version = "0.1.0"
description = "CycloneWatch FastAPI backend — PS70 SIH 2026"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.31",
    "alembic==1.13.2",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "geoalchemy2==0.15.2",
    "shapely==2.0.5",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "rasterio==1.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "aiosqlite==0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
