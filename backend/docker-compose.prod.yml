# ──────────────────────────────────────────────────────
# CycloneWatch — PROD Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────
version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: cyclonewatch_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DB not exposed to host in prod
    expose:
      - "5432"

  api:
    build:
      context: .
      target: prod
    container_name: cyclonewatch_api_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEBUG: "false"
    ports:
      - "8000:8000"
    # No volume mounts in prod — source is baked into image
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_prod:
